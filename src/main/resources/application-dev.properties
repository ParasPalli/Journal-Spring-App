# -------- Kafka configuration
# Kafka Broker
spring.kafka.bootstrap-servers=kafka-1b669479-paraspalli1234-5af0.k.aivencloud.com:19895

# SSL Configuration (Aiven)
spring.kafka.properties.security.protocol=SSL
spring.kafka.properties.ssl.truststore.type=PEM
spring.kafka.properties.ssl.keystore.type=PEM

spring.kafka.properties.ssl.truststore.certificates=classpath:certs/ca.pem
spring.kafka.properties.ssl.keystore.certificate.chain=classpath:certs/service.cert
spring.kafka.properties.ssl.keystore.key=classpath:certs/service.key
spring.kafka.properties.session.timeout.ms=45000

# Consumer
spring.kafka.consumer.group-id=cron-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.StringDeserializer

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.StringSerializer

